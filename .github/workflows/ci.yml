name: build

# Verifies the native firmware compiles for ESP32-S3 on every push and PR,
# using the official ESP-IDF v5.4.2 container (matches local ~/esp install).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4

      - name: idf.py build (esp32s3)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd native_firmware
          idf.py set-target esp32s3
          idf.py build

      - name: Firmware size summary
        if: always()
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd native_firmware
          idf.py size || true

  unit-tests:
    # Fast host tests — no QEMU, no hardware. Validate the data/algorithm
    # contracts and the emulator harness helpers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install -r tests/requirements.txt
      - name: pytest
        run: python -m pytest tests/unit
