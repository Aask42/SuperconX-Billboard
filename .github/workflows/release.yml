name: release

# Versioned firmware release pipeline (issue #10).
#
# Trigger:
#   - pushing a semver tag `v*`  -> builds, validates, and publishes a GitHub Release
#   - workflow_dispatch          -> same build + validation for a rehearsal (no Release;
#                                    the artifacts are attached to the workflow run)
#
# Toolchain is kept identical to .github/workflows/ci.yml and emulator.yml:
#   container espressif/idf:v5.4.2, `idf.py set-target esp32s3 && idf.py build`,
#   and the Espressif QEMU 9.2.2 install from emulator.yml for the boot smoke.
#
# NOTE: this is an APP-ONLY release. The LittleFS `storage` image (0x310000) holds
# third-party assets that are gitignored and not yet cleared for redistribution,
# so it is never built or attached here. See BADGE_REPORT.md and tests/COVERAGE.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a rehearsal build (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ boot smoke
  # QEMU boot smoke for the tagged source, reusing the maintained emulator harness.
  # The release artifacts are the production config (QIO flash + USB-Serial/JTAG
  # console), which QEMU cannot boot; emu.py rebuilds the SAME tagged source with
  # the emulator overlay (DIO + UART0, see emulator/sdkconfig.emulator) so the
  # identical code path is smoke-tested. The production artifacts themselves are
  # validated separately by `esptool image_info` + the manifest/offset checks in
  # the `build` job.
  qemu-smoke:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    env:
      QEMU_TAG: esp-develop-9.2.2-20260417
      QEMU_VER: esp_develop_9.2.2_20260417
    steps:
      - uses: actions/checkout@v4

      - name: Install Espressif QEMU 9.2.2 (8 MB octal PSRAM) + test deps
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq libsdl2-2.0-0 libslirp0 libpixman-1-0 >/dev/null
          mkdir -p /opt/qemu && cd /opt/qemu
          curl -sL "https://github.com/espressif/qemu/releases/download/${QEMU_TAG}/qemu-xtensa-softmmu-${QEMU_VER}-x86_64-linux-gnu.tar.xz" | tar xJ
          . "$IDF_PATH/export.sh"
          python -m pip install -q -r tests/requirements.txt
          echo "EMU_QEMU=/opt/qemu/qemu/bin/qemu-system-xtensa" >> "$GITHUB_ENV"

      - name: Build (emulator overlay)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python emulator/emu.py build

      - name: Boot smoke against the release source
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python emulator/emu.py test emulator/scenarios/boot_smoke.scn --quiet

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qemu-logs
          path: emulator/out/**/*.log

  # ------------------------------------------------------------------ build + validate
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then echo "empty version from '$RAW'"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build production firmware (esp32s3, PROJECT_VER embedded)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C native_firmware set-target esp32s3
          # PROJECT_VER is injected as a CMake cache entry so the tag version lands
          # in esp_app_desc_t without touching native_firmware/CMakeLists.txt.
          idf.py -C native_firmware -D PROJECT_VER="$VERSION" build

      - name: Merge full image + stage release assets
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          BUILD=native_firmware/build
          mkdir -p dist
          MERGED="superconx-billboard-${VERSION}-merged.bin"
          FACTORY="superconx-billboard-${VERSION}-factory.bin"

          # Full image, flashable at 0x0 (app-only: @flash_args has no storage entry).
          ( cd "$BUILD" && python -m esptool --chip esp32s3 merge_bin \
              --output "$MERGED" --fill-flash-size 8MB @flash_args )
          cp "$BUILD/$MERGED" "dist/$MERGED"

          # Component parts for manual esptool flashing.
          cp "$BUILD/bootloader/bootloader.bin"            dist/bootloader.bin
          cp "$BUILD/partition_table/partition-table.bin"  dist/partition-table.bin
          cp "$BUILD/superconx_billboard.bin"              "dist/$FACTORY"

          # ESP Web Tools manifest (offsets read from the build, checked vs partitions.csv).
          python scripts/make_manifest.py \
            --version "$VERSION" \
            --flasher-args "$BUILD/flasher_args.json" \
            --bootloader bootloader.bin \
            --partition-table partition-table.bin \
            --factory "$FACTORY" \
            --out dist/manifest.json

          # Checksums over every asset (SHA256SUMS itself excluded).
          ( cd dist && sha256sum \
              "$MERGED" bootloader.bin partition-table.bin "$FACTORY" manifest.json > SHA256SUMS )
          echo "---- dist ----" && ls -l dist && echo "---- SHA256SUMS ----" && cat dist/SHA256SUMS

      - name: Validate release (image_info, manifest, offsets, app-only invariant)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/validate_release.py \
            --dist dist \
            --manifest dist/manifest.json \
            --merged "dist/superconx-billboard-${VERSION}-merged.bin" \
            --factory "dist/superconx-billboard-${VERSION}-factory.bin" \
            --partitions native_firmware/partitions.csv \
            --version "$VERSION"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/**
          if-no-files-found: error

  # ------------------------------------------------------------------ publish
  # Only on a real tag push, and only after the smoke + build/validation pass.
  # Runs on the host runner (not the IDF container) so the preinstalled `gh` CLI
  # and GITHUB_TOKEN publish the Release. Rehearsals (workflow_dispatch) stop at
  # the validated artifacts above and never create a Release.
  release:
    runs-on: ubuntu-latest
    needs: [qemu-smoke, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Render release notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed "s/{{VERSION}}/${VERSION}/g" scripts/release-notes.md.tmpl > notes.md
          echo "---- notes.md ----" && cat notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SuperconX Billboard ${TAG}" \
            --notes-file notes.md \
            dist/*
